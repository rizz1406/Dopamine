name = "dopamine"
main = "worker.js"
compatibility_date = "2024-09-01"

# Static site served straight from the Worker's edge — free, unlimited requests
[assets]
directory = "../public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 free tier: 5M row reads/day, 100k writes/day
[[d1_databases]]
binding = "DB"
database_name = "dopamine"
database_id = "b74eea69-b878-429a-b188-29e781545b68"

# Secrets (set via: npx wrangler secret put ADMIN_PASSWORD / SECRET)
# [vars] not used for secrets
